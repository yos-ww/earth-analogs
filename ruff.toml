# Python style for pipeline/ and setup/: `ruff format` and `ruff check`.
line-length = 110
target-version = "py312"

[lint]
# pyflakes plus pycodestyle errors: real problems only, no style opinions.
select = ["E4", "E7", "E9", "F"]
# Named lambdas are used on purpose for short filters.
ignore = ["E731"]
